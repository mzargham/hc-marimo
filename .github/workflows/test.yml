name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run test suite
        run: uv run --group dev pytest -q

      - name: Smoke-test the talk notebook runs end-to-end
        run: uv run marimo export html talk.py -o /tmp/talk.html
